model_list:
  # LiteLLM expects timeout/retry values as YAML numbers here. Do not use
  # os.environ/VAR for these numeric fields unless LiteLLM starts casting them;
  # otherwise some async paths compare strings to ints.
  # Small fallback model. Ollama's OpenAI-compatible /v1 API is used because
  # it responds quickly and avoids provider-specific Ollama hangs in LiteLLM.
  - model_name: edge-gemma
    litellm_params:
      model: os.environ/EDGE_GEMMA_LITELLM_MODEL
      api_base: os.environ/EDGE_GEMMA_API_BASE
      api_key: os.environ/LOCAL_LLM_API_KEY
      timeout: 60
      stream_timeout: 15
      max_retries: 0

  # Main large model on the llama.cpp server.
  - model_name: big-boss
    litellm_params:
      model: os.environ/BIG_BOSS_LITELLM_MODEL
      api_base: os.environ/BIG_BOSS_API_BASE
      api_key: os.environ/LOCAL_LLM_API_KEY
      timeout: 180
      stream_timeout: 30
      max_retries: 0

  # Text embedding route for AlphaRavis pgvector memory and rag_api mirrors.
  # Default env uses Ollama-native LiteLLM model ids, for example
  # EMBEDDING_LITELLM_MODEL=ollama/qwen3-embedding:0.6b with
  # EMBEDDING_API_BASE=http://<ollama-host>:11434. For a future
  # OpenAI-compatible embedding server, set model=openai/<served-model> and
  # api_base=http://<host>:<port>/v1.
  - model_name: memory-embed
    litellm_params:
      model: os.environ/EMBEDDING_LITELLM_MODEL
      api_base: os.environ/EMBEDDING_API_BASE
      api_key: os.environ/LOCAL_LLM_API_KEY
      timeout: 30
      max_retries: 0

  # Smaller embedding fallback if the primary Qwen embedding route has trouble.
  - model_name: memory-embed-fallback
    litellm_params:
      model: os.environ/EMBEDDING_FALLBACK_LITELLM_MODEL
      api_base: os.environ/EMBEDDING_API_BASE
      api_key: os.environ/LOCAL_LLM_API_KEY
      timeout: 30
      max_retries: 0

  # Experimental vision embedding route. AlphaRavis keeps vision vector memory
  # disabled by default; use only with ALPHARAVIS_ENABLE_VISION_VECTOR_MEMORY
  # after probing the target backend explicitly.
  - model_name: vision-embed
    litellm_params:
      model: os.environ/VISION_EMBEDDING_LITELLM_MODEL
      api_base: os.environ/VISION_EMBEDDING_API_BASE
      api_key: os.environ/LOCAL_LLM_API_KEY
      timeout: 60
      max_retries: 0

  - model_name: vision-embed-fallback
    litellm_params:
      model: os.environ/VISION_EMBEDDING_FALLBACK_LITELLM_MODEL
      api_base: os.environ/VISION_EMBEDDING_API_BASE
      api_key: os.environ/LOCAL_LLM_API_KEY
      timeout: 60
      max_retries: 0

litellm_settings:
  num_retries: 0
  request_timeout: 180
