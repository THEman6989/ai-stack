version: 1.3.9
interface:
  modelSelect: true
  parameters: true
  presets: false
endpoints:
  custom:
    - name: "LangGraph Agent"
      apiKey: "sk-1234" # Dummy Key
      baseURL: "http://api-bridge:8123/v1"
      models:
        default: ["my-agent"]
        fetch: false
    - name: "Hermes Agent"
      apiKey: "${HERMES_API_KEY}"
      baseURL: "${HERMES_API_BASE}"
      models:
        default: ["${HERMES_MODEL}"]
        fetch: false
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "alpharavis-responses"
      label: "AlphaRavis Responses"
      default: true
      description: "LangGraph agent with Open Responses reasoning, tool, and activity events."
      preset:
        endpoint: "LangGraph Agent"
        model: "my-agent"
        modelLabel: "AlphaRavis Responses"
        useResponsesApi: true
        reasoning_summary: "detailed"
        reasoning_effort: "medium"
        verbosity: "medium"
        disableStreaming: false
    - name: "alpharavis-chat"
      label: "AlphaRavis Chat"
      description: "Legacy Chat Completions path for fallback compatibility."
      preset:
        endpoint: "LangGraph Agent"
        model: "my-agent"
        modelLabel: "AlphaRavis Chat"
        useResponsesApi: false
        disableStreaming: false
